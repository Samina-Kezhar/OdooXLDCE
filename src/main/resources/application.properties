spring.application.name=GlobeTrotter

# In-Memory Database Configuration (H2) -> Changed to File-based to persist across restarts!
spring.datasource.url=jdbc:h2:file:./data/globetrotterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (so they can view it in browser if they want)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
